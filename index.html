<body class="fixed inset-0 h-[100dvh] flex flex-col selection:bg-cyan-500 selection:text-white relative overflow-hidden">

        <div class="relative w-64 h-64 flex items-center justify-center float-slow z-10" id="loginLogoContainer">
           <div class="absolute top-4 w-40 h-32 bg-white rounded-3xl shadow-2xl border-b-8 border-sky-200 flex flex-col items-center justify-center overflow-hidden z-25">
               <div class="absolute -top-4 w-2 h-6 bg-slate-300"></div>
               <div class="absolute -top-6 w-4 h-4 bg-amber-400 rounded-full animate-pulse shadow-[0_0_10px_#fbbf24]"></div>
               <div class="flex gap-6 mt-2">
                   <div class="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center overflow-hidden"><div class="w-4 h-4 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_8px_#22d3ee]"></div></div>
                   <div class="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center overflow-hidden"><div class="w-4 h-4 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_8px_#22d3ee]"></div></div>
               </div>

        </div>

          <h2 class="text-3xl font-black text-white tracking-tight drop-shadow-md">PT. GRUP BANGUN BERSAMA</h2>
          <p class="text-sm text-cyan-100 mt-2 font-medium tracking-wide">Enterprise Cloud v6.2 • GBB Ruang Sejuk</p>
        </div>
      </div>

      <div id="formLoginView" class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center bg-white/60 relative">
        <div class="max-w-sm mx-auto w-full">
          <div class="text-center mb-8">
            <div id="loginSmallLogo" class="w-20 h-20 sm:w-24 sm:h-24 mx-auto mb-4 rounded-3xl bg-white p-2 shadow-xl shadow-sky-100 border border-sky-100 flex items-center justify-center relative overflow-hidden">
              <div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl text-white font-black text-2xl shadow-inner"><i class="fa-solid fa-snowflake animate-spin" style="animation-duration: 8s;"></i></div>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-slate-900">Selamat Datang</h1>
            <p class="text-xs text-sky-600 font-bold mt-1">Sistem Manajemen Servis AC Terpadu</p>
          </div>

          <!-- BANNER INDIKATOR FIREBASE -->
          <div id="cloudSyncIndicator" class="mb-4 text-center py-2 bg-emerald-50 text-emerald-700 rounded-xl text-[10px] font-black border border-emerald-200 shadow-sm animate-pulse cursor-pointer" onclick="alert(this.innerText)">
             <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Memeriksa Koneksi Database...
          </div>
          
          <div id="installAppContainer" class="hidden mb-4 p-3 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl text-white text-xs flex items-center justify-between shadow-lg">
             <div class="flex items-center gap-2.5"><i class="fa-solid fa-cloud-arrow-down text-lg animate-bounce"></i><span>Install Aplikasi ke HP Anda</span></div>
             <button type="button" onclick="window.installPWA()" class="bg-white text-cyan-700 font-black px-3 py-1.5 rounded-xl shadow transition">Install</button>
          </div>

          <form onsubmit="window.handleManualLogin(event)" class="space-y-4">

              <label class="block text-[11px] font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Username / No. WhatsApp</label>
              <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-user text-sm"></i></div>
                <input type="text" id="loginUsername" required placeholder="Contoh: admin atau 08123456789" class="w-full bg-white/90 border border-slate-200 focus:bg-white focus:border-cyan-500 rounded-xl py-3.5 pl-11 pr-4 text-sm text-slate-900 outline-none transition-all shadow-sm">

            </div>

              <label class="block text-[11px] font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Kata Sandi / PIN</label>
              <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-lock text-sm"></i></div>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-white/90 border border-slate-200 focus:bg-white focus:border-cyan-500 rounded-xl py-3.5 pl-11 pr-4 text-sm text-slate-900 outline-none transition-all shadow-sm">
              </div>
            </div>
            <button type="submit" class="w-full py-4 mt-2 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-black text-sm shadow-xl shadow-cyan-600/30 transition-all active:scale-[0.98]">Masuk Dashboard <i class="fa-solid fa-arrow-right ml-1"></i></button>

          <div class="grid grid-cols-2 gap-2 mt-4">
            <button type="button" onclick="window.togglePublicBooking(true)" class="w-full py-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-black text-xs transition-all flex items-center justify-center gap-1.5"><i class="fa-solid fa-calendar-check"></i> Booking AC</button>
            <button type="button" onclick="window.toggleCustomerRegister(true)" class="w-full py-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 font-black text-xs transition-all flex items-center justify-center gap-1.5"><i class="fa-solid fa-user-plus"></i> Daftar Akun</button>

      <!-- FORM PUBLIK BISA DIABAIKAN SEMENTARA -->
      <div id="formPublicView" class="w-full md:w-1/2 p-6 flex-col justify-center bg-white/60 relative hidden">
         <button type="button" onclick="window.togglePublicBooking(false)" class="bg-slate-200 py-2 px-4 rounded mb-4 text-xs font-bold">Kembali</button>
      </div>
      <div id="formCustomerRegisterView" class="w-full md:w-1/2 p-6 flex-col justify-center bg-white/60 relative hidden">
         <button type="button" onclick="window.toggleCustomerRegister(false)" class="bg-slate-200 py-2 px-4 rounded mb-4 text-xs font-bold">Kembali</button>
      </div>

  <!-- APLIKASI UTAMA (DIPOTONG AGAR FOKUS KE KONEKSI SAJA UNTUK SEMENTARA) -->
  <div id="mainAppShell" class="flex-1 flex overflow-hidden hidden relative w-full h-full z-10 bg-white">
     <div class="p-10 w-full text-center my-auto">
        <h1 class="text-3xl font-black text-cyan-600">Berhasil Masuk ke Aplikasi!</h1>
        <p class="text-slate-500 mt-4">Jika Anda bisa melihat halaman ini, berarti koneksi lokal aman.</p>
        <button onclick="window.logout()" class="mt-8 px-6 py-3 bg-rose-500 text-white font-bold rounded-xl shadow-lg">Keluar (Logout)</button>
     </div>
  </div>

  <script>
    const GBB_STATE = {
      currentUser: null, role: 'admin', activeTab: 'dashboard',
      users: { admin: { user: 'admin', pass: 'admin123' } },
      settings: {}, customers: [], technicians: [], catalog: [], orders: []
    };

    // =========================================================================
    // KONFIGURASI FIREBASE CLOUD (SMART DEBUGGER)
    // =========================================================================
    
    // GANTI LINK URL DI BAWAH INI SESUAI FIREBASE ANDA
    const firebaseConfig = {
      apiKey: "AIzaSyCv4Fu-YJw8sqREapYn2xMpxQyttZrNldg",
      authDomain: "gbbcooling.firebaseapp.com",
      databaseURL: "https://gbbcooling-default-rtdb.firebaseio.com", // <-- Cek URL INI!
      projectId: "gbbcooling",
      storageBucket: "gbbcooling.firebasestorage.app",
      messagingSenderId: "817517370571",
      appId: "1:817517370571:web:2dd6053ef6f99a4d59cf4e"
    };

    let isCloudReady = false;
    let cloudDbRef = null;

    function initializeSmartFirebase() {
        const cloudInd = document.getElementById('cloudSyncIndicator');
        
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const database = firebase.database();
            cloudDbRef = database.ref('gbb_cloud_v6_2');
            
            // DETEKSI 1: KONEKSI INTERNET KE GOOGLE
            const connectedRef = database.ref(".info/connected");
            connectedRef.on("value", (snap) => {
                if (snap.val() === true) {
                    isCloudReady = true;
                    cloudInd.className = 'mb-4 text-center py-2 bg-blue-50 text-blue-700 rounded-xl text-[10px] font-black border border-blue-200 shadow-sm transition-all';
                    cloudInd.innerHTML = '<i class="fa-solid fa-cloud-check mr-1"></i> Terhubung ke Cloud!';
                } else {
                    isCloudReady = false;
                    setTimeout(() => {
                        if (!isCloudReady && cloudInd) {
                            cloudInd.className = 'mb-4 text-center py-2 bg-rose-50 text-rose-700 rounded-xl text-[10px] font-black border border-rose-200 shadow-sm';
                            cloudInd.innerHTML = '<i class="fa-solid fa-wifi mr-1"></i> Offline. Coba sambung ulang...';
                        }
                    }, 3000);
                }
            });

            // DETEKSI 2: PENGAMBILAN DATA & IZIN AKSES (RULES)
            cloudDbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.settings) GBB_STATE.settings = data.settings;
                    if (data.users) GBB_STATE.users = data.users;
                } else {
                    // Database kosong, kita coba tulis data pertama kali
                    if(window.saveToCloud) window.saveToCloud();
                }
            }, (error) => {
                // JIKA FIREBASE MENOLAK KONEKSI, TAMPILKAN ALASANNYA DI LAYAR!
                isCloudReady = false;
                cloudInd.className = 'mb-4 text-center py-2 bg-red-100 text-red-800 rounded-xl text-[10px] font-black border border-red-300 shadow-sm';
                cloudInd.innerHTML = '<i class="fa-solid fa-ban mr-1"></i> Firebase Error: ' + error.code;
                showCustomAlert('Error Database', 'Gagal memuat data dari Firebase! \nAlasan: ' + error.message + '\n\nCek Rules Firebase Anda, pastikan .read dan .write diset ke true.', 'fa-solid fa-bug text-red-500');
            });

        } catch (e) {
            // JIKA URL ATAU API KEY SALAH FORMAT
            if(cloudInd) {
                cloudInd.className = 'mb-4 text-center py-2 bg-amber-100 text-amber-800 rounded-xl text-[10px] font-black border border-amber-300 shadow-sm';
                cloudInd.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Salah Konfigurasi: ' + e.message;
            }
        }
    }

    window.saveToCloud = function() {
        if(!cloudDbRef || !isCloudReady) return;
        cloudDbRef.set({
            settings: GBB_STATE.settings,
            users: GBB_STATE.users,
            customers: GBB_STATE.customers,
            orders: GBB_STATE.orders,
            catalog: GBB_STATE.catalog,
            technicians: GBB_STATE.technicians
        }).catch(err => {
            showCustomAlert('Gagal Simpan', 'Data tidak bisa disimpan. \nAlasan: ' + err.message, 'fa-solid fa-triangle-exclamation text-amber-500');
        });
    };

    // =========================================================================

    window.onload = function() {
        // Tampilkan tombol instal di HP
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (isMobile && !isStandalone) {
            setTimeout(() => {
                const el = document.getElementById('installAppContainer');
                if(el) el.classList.remove('hidden');
            }, 1000);
        }
        
        // Mulai sistem Firebase Canggih
        initializeSmartFirebase();
    };

    window.handleManualLogin = function(e) {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value.trim(); const p = document.getElementById('loginPassword').value.trim();
      if (u === GBB_STATE.users.admin.user && p === GBB_STATE.users.admin.pass) { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('mainAppShell').classList.remove('hidden'); return; }
      showCustomAlert('Login Gagal', 'Username dan Password (admin/admin123) salah.', 'fa-solid fa-triangle-exclamation text-rose-500');
    };

    window.logout = function() { document.getElementById('mainAppShell').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); };
    window.togglePublicBooking = function(show) {}; window.toggleCustomerRegister = function(show) {};
  </script>
</body>
